<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F03 — Focus row via blur</title>
<link rel="stylesheet" href="../../assets/marketing.css">
<style>
  html,body{margin:0;background:#ddd;}
  /* F03: the card COMMANDS the frame (ref-06 ratio) — big card, tight margins. */
  .f03-card{position:absolute; left:290px; top:196px; width:1020px; z-index:2;}
  .f03-card .mv-listcard__head{padding:32px 36px 0;}
  .f03-card .mv-listcard__title{font-size:36px;}
  .f03-card .mv-listcard__count{font-size:23px;}
  .f03-card .mv-listcard__hr{margin:22px 0 10px;}
  .f03-card .mv-listcard__body{padding:0 22px 22px;}
  .f03-card .mv-row{padding:22px 18px; gap:20px;}
  .f03-card .mv-row__avatar{width:64px; height:64px; border-radius:16px; font-size:26px;}
  .f03-card .mv-row__name{font-size:27px;}
  .f03-card .mv-row__meta{font-size:21px;}
  .f03-logos{display:flex; align-items:center; margin-left:auto;}
  .f03-logos .mv-cc__av{width:40px; height:40px; margin-left:-8px;}
  .f03-logos .mv-cc__av:first-child{margin-left:0;}
</style>
</head>
<body>
<div class="mv-stage" id="stage">
  <div class="mv-canvas mv-canvas--cream"></div>

  <div class="f03-card">
    <div class="mv-listcard mv-floating">
      <div class="mv-listcard__head">
        <span class="mv-listcard__title">Your team</span>
        <span class="mv-listcard__count">6 colleagues</span>
      </div>
      <div class="mv-listcard__hr"></div>
      <div class="mv-listcard__body">

        <div class="mv-row mv-row--blur">
          <div class="mv-row__avatar" style="background:linear-gradient(160deg,#5b76c9,#3f57a8);">D</div>
          <div><div class="mv-row__name">Devin</div><div class="mv-row__meta">Data Analyst</div></div>
          <div class="mv-row__right"><span class="mv-row__meta">Idle</span></div>
        </div>

        <!-- FOCUS row: real, useful signal — live task, connected tools, output count -->
        <div class="mv-row mv-row--focus">
          <div class="mv-row__avatar" style="background:linear-gradient(160deg,#8a6d80,#4a3850);">R</div>
          <div style="min-width:0;">
            <div class="mv-row__name">Riley</div>
            <div class="mv-row__meta">Running: Weekly metrics review · 3 shipped today</div>
          </div>
          <div class="f03-logos">
            <span class="mv-cc__av" style="background:#fff;border-color:#ece8e4;"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313z" fill="#E01E5A"/><path d="M8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312z" fill="#36C5F0"/><path d="M18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312z" fill="#2EB67D"/><path d="M15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z" fill="#ECB22E"/></svg></span>
            <span class="mv-cc__av" style="background:#5E6AD2;"><svg width="19" height="19" viewBox="0 0 100 100" fill="#fff"><path d="M1.2 61.5a2 2 0 0 1 .6-1.8L60.3 1.8a2 2 0 0 1 3.2.9 49.9 49.9 0 0 1-61.4 61.4 2 2 0 0 1-.9-2.6ZM.2 45.9 45.9.2A50 50 0 0 0 .2 45.9ZM8.3 74.6a50.2 50.2 0 0 0 17.1 17.1L91.7 25.4A50.2 50.2 0 0 0 74.6 8.3ZM38.5 98.8a49.9 49.9 0 0 0 60.3-60.3Z"/></svg></span>
            <span class="mv-cc__av" style="background:#eee7ec;color:#755a68;font-size:15px;font-weight:480;">+2</span>
          </div>
        </div>

        <div class="mv-row mv-row--blur">
          <div class="mv-row__avatar" style="background:linear-gradient(160deg,#4bb389,#2d8f68);">M</div>
          <div><div class="mv-row__name">Maya</div><div class="mv-row__meta">Support Lead</div></div>
          <div class="mv-row__right"><span class="mv-row__meta">Idle</span></div>
        </div>

      </div>
    </div>
  </div>

</div>
</body>
</html>
